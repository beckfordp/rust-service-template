# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # 24.04: the PostgreSQL 16 binaries below (ubuntu-latest, 26.04, has none).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rustup (preinstalled on the runner) installs the toolchain and
      # components pinned in rust-toolchain.toml.
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Same cargo-llvm-cov as gluon bin/sandbox-setup; cargo-audit only runs
      # here, where the RustSec advisory database is reachable.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-audit

      - uses: Swatinem/rust-cache@v2

      # The Postgres-backed tests start a throwaway cluster from the local
      # PostgreSQL 16 binaries (no Docker in the sandbox); the runner image
      # has them, off the PATH.
      - name: PostgreSQL 16 binaries on the PATH
        run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      # The Redis-backed tests (gluon-rs service-testing) start a throwaway
      # redis-server from the PATH; the runner image has none.
      - name: redis-server on the PATH
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends redis-server

      # The crates depend on gluon-rs by path (../../lib/gluon-rs in gluon's layout);
      # recreate that layout beside the checkout.
      - name: gluon-rs where the path dependencies expect it
        run: git clone --depth 1 https://github.com/beckfordp/gluon-rs.git "$GITHUB_WORKSPACE/../../lib/gluon-rs"

      # The same script the sandbox runs, so the two can't drift.
      - name: CI checks
        run: scripts/ci.sh
