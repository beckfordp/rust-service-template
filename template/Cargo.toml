# SPDX-License-Identifier: MIT
# {{project-name}}-rs: the Rust port of gluon's {{project-name}} (ADR 0029).
[workspace]
resolver = "3"
members = ["crates/{{project-name}}"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

# Every member opts in with `[lints] workspace = true` (conductor/tech-stack.md).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# conductor/code_styleguides/rust.md rule 2: no panicking shortcuts outside tests
# (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
