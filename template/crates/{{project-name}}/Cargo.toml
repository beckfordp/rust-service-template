# SPDX-License-Identifier: MIT

[package]
name = "{{project-name}}"
description = "The {{project-name}} binary: the Rust port of gluon's Scala {{project-name}} (ADR 0029)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
{%- if kafka %}
kafka-client = { path = "../../../../lib/gluon-rs/crates/kafka-client" }
kafka-event-consumer = { path = "../../../../lib/gluon-rs/crates/kafka-event-consumer" }
{%- endif %}
service-basics = { path = "../../../../lib/gluon-rs/crates/service-basics" }
telemetry = { path = "../../../../lib/gluon-rs/crates/telemetry" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
service-testing = { path = "../../../../lib/gluon-rs/crates/service-testing" }
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
